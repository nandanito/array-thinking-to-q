# q-verify — the q half of `make verify`, on trusted branches only.
#
# WHY THIS IS NOT A PR CHECK. Running q needs a KDB-X CE license key, and GitHub
# does not expose secrets to workflows triggered by a fork's pull_request. A PR
# check that cannot get a key would fail for every outside contributor and block
# nothing useful. So: schedule + manual + push-to-main. Failures notify (GitHub
# emails the owner on a failed scheduled run); they never block a merge, because
# by the time this runs the merge already happened. That asymmetry is deliberate
# and is why `j-verify.yml` — which needs no key — remains the blocking check.
#
# IT RUNS `make verify`, NOT `make verify-q`. verify-eval and verify-eval-run are
# what keep the PUBLISHED eval numbers honest (they recompute results.csv's
# correctness column and re-derive runs/traces.md from the committed logs, and
# fail on disagreement). Narrowing this to verify-q would leave those unenforced
# anywhere but the author's laptop, which was the whole reason this file exists.
#
# IT DELIBERATELY DOES NOT CACHE OR UPLOAD THE q BINARY. KX CE License Clause 2.1
# prohibits making the Software available to third parties; a cache or artifact on
# a public repository is exactly that. Reinstall every run. See
# docs/licensing-notes.md.
#
# ONE SECRET REQUIRED (repo Settings → Secrets and variables → Actions):
#   KX_B64LIC   base64 `kc.lic` contents from the KX welcome email.
# GitHub masks it in logs. Do not echo it, and do not add `set -x`.
#
# NO BEARER TOKEN IS NEEDED, despite the Developer Center handing you a command
# that contains one. That command is generated per-user with `--oauth2-bearer
# <token>` pre-populated, so it LOOKS like the download is gated. Measured
# 2026-07-29: the installer and every payload it fetches return 200 with no
# credential at all —
#   …/install_kdb/~latest~/install_kdb.sh   200, byte-identical to a known-good local copy
#   …/kdb-x/~latest~/{l64,m64,l64arm}.zip   200
# and the installer's own `download_file()` uses a bare `curl --fail -Lo` with no
# auth header, which is the same conclusion from the other direction. An earlier
# revision of this file demanded a KX_INSTALL_TOKEN secret; that requirement was
# inferred, never measured, and was wrong. (The 401 that seemed to confirm it came
# from a mistyped URL missing the `/install_kdb/~latest~/` segment.)
#
# Nothing here circumvents a licence check: `kc.lic` is still required for q to
# RUN, and that key is still the secret. Only the download endpoint is open.
#
# OPTIONAL REPO VARIABLE:
#   KX_INSTALL_URL   override if KX moves the installer.
#
# WHAT IS AND IS NOT VERIFIED — read before trusting this file:
#   VERIFIED: `make verify` passes locally on KDB-X CE 5.0 / J 9.7.1; the J steps
#     come from j-verify.yml, green today; `.z.K` prints the bare version (`5f`)
#     and no licensed serial/email/host; the installer URL and payload URLs above
#     were fetched and checked; `-y` requires `--b64lic` and defaults INSTALL_DIR
#     to `$HOME/.kx`.
#   NOT VERIFIED: a full install has never completed on a CI runner. If it fails,
#     it fails loudly with the reason — intended. A silent skip would be the bug
#     (docs/COMPOUND.md).

name: q-verify

on:
  schedule:
    - cron: "0 3 * * *"     # nightly, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

# Never let two installs race on the same runner-side state.
concurrency:
  group: q-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail LOUDLY when the credentials are absent. docs/COMPOUND.md records the
      # j-verify stub that passed while verifying nothing: "a gate that cannot be
      # enforced must FAIL, not pass." A `continue-on-error` or an `if: secrets…`
      # skip here would recreate that exact defect.
      - name: Assert the license secret is present
        env:
          B64LIC: ${{ secrets.KX_B64LIC }}
        run: |
          set -euo pipefail
          if [ -z "${B64LIC:-}" ]; then
            echo "::error::secret KX_B64LIC is not set"
            echo "q-verify cannot run without it. See the header of this workflow."
            exit 1
          fi
          echo "KX_B64LIC present"

      - name: Install J 9.7 (headless, no Qt IDE, no addons)
        run: |
          set -euo pipefail
          # Must be www.jsoftware.com — the bare host's TLS cert does not cover it.
          # Download then run: `curl | sh` reports the SHELL's status, so a failed
          # fetch would exit 0 having installed nothing (docs/COMPOUND.md).
          curl -fsSL https://www.jsoftware.com/download/j9.7/jinstall.sh -o "$RUNNER_TEMP/jinstall.sh"
          sh "$RUNNER_TEMP/jinstall.sh" --qt none --no-addons
          test -x "$HOME/j9.7/bin/jconsole" || { echo "::error::jconsole not installed"; exit 1; }

      - name: Install KDB-X Community Edition
        env:
          B64LIC: ${{ secrets.KX_B64LIC }}
          INSTALL_URL: ${{ vars.KX_INSTALL_URL || 'https://portal.dl.kx.com/assets/raw/kdb-x/install_kdb/~latest~/install_kdb.sh' }}
        run: |
          set -euo pipefail
          # Fetch to a file and assert it. `curl | sh` reports the SHELL's status,
          # so a failed fetch would "succeed" having installed nothing (COMPOUND).
          curl -fsSL "$INSTALL_URL" -o "$RUNNER_TEMP/install_kdb.sh"
          test -s "$RUNNER_TEMP/install_kdb.sh" \
            || { echo "::error::installer empty or unreachable — set repo variable KX_INSTALL_URL if KX moved it"; exit 1; }
          # -y implies non-interactive and REQUIRES --b64lic; INSTALL_DIR defaults to $HOME/.kx.
          bash "$RUNNER_TEMP/install_kdb.sh" -y --b64lic "$B64LIC"
          QBIN="$HOME/.kx/bin/q"
          test -x "$QBIN" || { echo "::error::q not found at $QBIN after install"; exit 1; }
          echo "QBIN=$QBIN" >> "$GITHUB_ENV"

      - name: Force telemetry off, and prove it
        run: |
          set -euo pipefail
          # The installer's setup_telemetry() inspects the LICENSE (.z.l[4] for "tld")
          # and can set KX_UPLOAD_TELEMETRY=YES *before* the non-interactive branch
          # that would otherwise default it to NO. docs/licensing-notes.md records the
          # decision to decline telemetry, so make that deterministic rather than
          # dependent on what a licence flag happens to say on a given runner.
          cfg="$HOME/.kx/config"
          touch "$cfg"
          if grep -q '^KX_UPLOAD_TELEMETRY=' "$cfg"; then
            sed -i 's|^KX_UPLOAD_TELEMETRY=.*|KX_UPLOAD_TELEMETRY=NO|' "$cfg"
          else
            echo 'KX_UPLOAD_TELEMETRY=NO' >> "$cfg"
          fi
          grep -q '^KX_UPLOAD_TELEMETRY=NO$' "$cfg" \
            || { echo "::error::failed to disable telemetry"; exit 1; }
          echo "telemetry disabled: $(grep '^KX_UPLOAD_TELEMETRY=' "$cfg")"

      - name: Show versions (no license serial, email or host — repo is public)
        run: |
          set -euo pipefail
          echo "9!:14''" | "$HOME/j9.7/bin/jconsole"
          # .z.K is the kdb+ version number; the startup BANNER carries the licensed
          # serial/email/host, which must never reach a public log (docs/toolchain.md).
          echo 'show .z.K; exit 0' | "$QBIN" -q

      - name: make verify (q lessons + J twins + aj golden + eval refs + eval run)
        run: make verify Q="$QBIN" J="$HOME/j9.7/bin/jconsole"
