<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The ceiling: fifteen paired tasks, one discordant pair</title>
  <desc id="desc">Fifteen tiles, one per paired task, each run once without the plugin (condition A) and once with KX's q plugin (condition B). Five tiles, tasks 02, 07, 10, 13 and 14, are filled dark: both conditions wrote byte-for-byte identical q. Eight tiles, tasks 01, 03, 04, 05, 06, 09, 11 and 12, are outlined: the code differed but scored identically. Task 15 is outlined and marked as a shared miss: both conditions produced the correct joined table but failed the exact output diff on an extra line, identically. Task 08 is the only discordant pair, highlighted: the plugin condition won on one checklist item, a judgement call about an unnecessary binding. A summary row reads: correctness 14 of 15 in both conditions; idiomaticity 73 of 75 without the plugin and 74 of 75 with it; discordant pairs, 1, where the pre-registered sign test needs about five to decide anything. The footer says the test never engaged: baseline already solves these tasks.</desc>

  <rect width="900" height="470" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="11" letter-spacing="2.2" fill="#6b7280">15 PAIRED TASKS · WITHOUT vs WITH KX'S q PLUGIN</text>
  <text x="450" y="72" text-anchor="middle" font-size="20" fill="#1f2937">The comparison never got a chance to run.</text>

  <!-- tiles: 15 across, x from 60, 52 wide, gap 4 -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="60"  y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="84"  y="143" fill="#475569">01</text>
    <rect x="112" y="108" width="48" height="60" fill="#1f2937"/><text x="136" y="143" fill="#ffffff">02</text>
    <rect x="164" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="188" y="143" fill="#475569">03</text>
    <rect x="216" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="240" y="143" fill="#475569">04</text>
    <rect x="268" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="292" y="143" fill="#475569">05</text>
    <rect x="320" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="344" y="143" fill="#475569">06</text>
    <rect x="372" y="108" width="48" height="60" fill="#1f2937"/><text x="396" y="143" fill="#ffffff">07</text>
    <rect x="424" y="108" width="48" height="60" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="448" y="143" fill="#1f2937" font-weight="700">08</text>
    <rect x="476" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="500" y="143" fill="#475569">09</text>
    <rect x="528" y="108" width="48" height="60" fill="#1f2937"/><text x="552" y="143" fill="#ffffff">10</text>
    <rect x="580" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="604" y="143" fill="#475569">11</text>
    <rect x="632" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8"/><text x="656" y="143" fill="#475569">12</text>
    <rect x="684" y="108" width="48" height="60" fill="#1f2937"/><text x="708" y="143" fill="#ffffff">13</text>
    <rect x="736" y="108" width="48" height="60" fill="#1f2937"/><text x="760" y="143" fill="#ffffff">14</text>
    <rect x="788" y="108" width="48" height="60" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="812" y="143" fill="#475569">15</text>
  </g>
  <!-- callouts -->
  <path d="M 448 172 L 448 196" stroke="#1f2937" stroke-width="1.2"/>
  <text x="448" y="212" text-anchor="middle" font-size="12" fill="#1f2937">the only discordant pair:</text>
  <text x="448" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">one checklist item, a judgement call</text>
  <path d="M 812 172 L 812 196" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="812" y="212" text-anchor="middle" font-size="12" fill="#475569">both missed,</text>
  <text x="812" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">identically</text>

  <!-- legend -->
  <g font-size="13" fill="#475569">
    <rect x="60" y="202" width="14" height="14" fill="#1f2937"/><text x="82" y="214">byte-for-byte identical q (5)</text>
    <rect x="60" y="226" width="14" height="14" fill="#ffffff" stroke="#94a3b8"/><text x="82" y="238">different code, same score (8)</text>
  </g>

  <!-- summary -->
  <line x1="60" y1="266" x2="840" y2="266" stroke="#e5e7eb"/>
  <text x="60" y="296" font-size="11" letter-spacing="2" fill="#6b7280">WITHOUT PLUGIN</text>
  <text x="250" y="296" font-size="11" letter-spacing="2" fill="#6b7280">WITH PLUGIN</text>
  <text x="440" y="296" font-size="11" letter-spacing="2" fill="#6b7280">DISCORDANT PAIRS</text>
  <g fill="#1f2937">
    <text x="60" y="330" font-size="15">Correct</text><text x="160" y="330" font-size="20" font-family="'SF Mono', Menlo, Consolas, monospace">14/15</text>
    <text x="60" y="362" font-size="15">Idiomatic</text><text x="160" y="362" font-size="20" font-family="'SF Mono', Menlo, Consolas, monospace">73/75</text>
    <text x="250" y="330" font-size="15">Correct</text><text x="350" y="330" font-size="20" font-family="'SF Mono', Menlo, Consolas, monospace">14/15</text>
    <text x="250" y="362" font-size="15">Idiomatic</text><text x="350" y="362" font-size="20" font-family="'SF Mono', Menlo, Consolas, monospace">74/75</text>
  </g>
  <text x="440" y="352" font-size="44" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1f2937">1</text>
  <text x="480" y="330" font-size="14" fill="#475569">The pre-registered sign test needs</text>
  <text x="480" y="350" font-size="14" fill="#475569">about five before it can decide</text>
  <text x="480" y="370" font-size="14" fill="#475569">anything. It never engaged.</text>

  <text x="450" y="430" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280">Not "the plugin doesn't help". The baseline model already solves these tasks, so the instrument had no headroom.</text>
  <text x="450" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">claude-opus-5 · q-knowledge@kx-skills pinned at 8b7040f · run 2026-07-26/27</text>
</svg>
