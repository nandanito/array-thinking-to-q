<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The asymmetric CI: J on every pull request, q only on trusted branches</title>
  <desc id="desc">Two lanes. The top lane is J: licence GPLv3, no key needed. Any pull request, including one from a stranger's fork, triggers the j-verify check, which blocks the merge if it fails. The bottom lane is q on KDB-X Community Edition: proprietary, key required. The key lives in a repository secret, which GitHub does not expose to pull requests from forks, so a fork cannot run the q suite. Instead the q-verify workflow runs make verify nightly, on every push to main, and on demand; a failure notifies the maintainer but never blocks. A note between the lanes says J is the only green check that depends on nobody's commercial terms.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="11" letter-spacing="2.2" fill="#6b7280">WHAT CAN RUN ON A STRANGER'S PULL REQUEST</text>
  <text x="450" y="72" text-anchor="middle" font-size="20" fill="#1f2937">One check needs nobody's permission. The other needs a key.</text>

  <!-- J lane -->
  <text x="40" y="118" font-size="11" letter-spacing="2" fill="#6b7280">J · GPLv3 · NO KEY</text>
  <rect x="40" y="130" width="190" height="64" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="135" y="158" text-anchor="middle" font-size="15" fill="#1f2937">Any pull request</text>
  <text x="135" y="178" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">including from a fork</text>
  <line x1="238" y1="162" x2="322" y2="162" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="330" y="130" width="230" height="64" fill="#1f2937"/>
  <text x="445" y="158" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ffffff">j-verify</text>
  <text x="445" y="178" text-anchor="middle" font-size="12" fill="#cbd5e1">runs the J examples</text>
  <line x1="568" y1="162" x2="652" y2="162" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="660" y="130" width="200" height="64" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="760" y="158" text-anchor="middle" font-size="15" fill="#1f2937">Blocks the merge</text>
  <text x="760" y="178" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">if it fails</text>

  <!-- middle note -->
  <line x1="40" y1="232" x2="860" y2="232" stroke="#e5e7eb"/>
  <text x="450" y="238" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280" style="paint-order:stroke" stroke="#ffffff" stroke-width="8">J is the only green check that depends on nobody's commercial terms.</text>

  <!-- q lane -->
  <text x="40" y="282" font-size="11" letter-spacing="2" fill="#6b7280">q · KDB-X CE · KEY REQUIRED</text>
  <rect x="40" y="294" width="190" height="64" fill="#ffffff" stroke="#e5e7eb" stroke-dasharray="4 3"/>
  <text x="135" y="322" text-anchor="middle" font-size="15" fill="#94a3b8">Pull request from a fork</text>
  <text x="135" y="342" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">no access to the secret</text>
  <line x1="238" y1="326" x2="292" y2="326" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="304" y="332" font-size="18" fill="#94a3b8">✕</text>

  <rect x="40" y="376" width="190" height="64" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="135" y="398" text-anchor="middle" font-size="14" fill="#1f2937">Nightly · push to main</text>
  <text x="135" y="418" text-anchor="middle" font-size="14" fill="#1f2937">· on demand</text>
  <line x1="238" y1="408" x2="322" y2="408" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="330" y="340" width="230" height="100" fill="#1f2937"/>
  <text x="445" y="372" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ffffff">q-verify</text>
  <text x="445" y="394" text-anchor="middle" font-size="12" fill="#cbd5e1">runs all of make verify</text>
  <text x="445" y="422" text-anchor="middle" font-size="12" fill="#cbd5e1">licence key from a repo secret</text>
  <line x1="568" y1="390" x2="652" y2="390" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="660" y="358" width="200" height="64" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="760" y="386" text-anchor="middle" font-size="15" fill="#1f2937">Notifies, never blocks</text>
  <text x="760" y="406" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">trusted branches only</text>
</svg>
