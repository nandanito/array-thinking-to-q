<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Where the defects surfaced</title>
  <desc id="desc">Thirteen defects from the project's log, sorted by the kind of check that found them, in four columns. A gate that runs (make verify and CI): typed q prompts in lesson 02's output blocks; em dashes in figure text, one inside a tspan; a missing CI secret, which turned main red. An independent review (Codex): a no-attribute grid cell that had an attribute; first bid where aj takes the last; the phrase name an index over a loop that binds items; connector tools in 3 of 15 plugin sessions. Preparing to publish (redaction and rendering): an auto-memory folder nobody had checked; a corrected claim left in a figure and its card. Running it somewhere new (a clean checkout of the eval harness): built-in plugins in every session; a seeded order with B first in every pair; a scorer that broke on relative paths; a redactor that rewrote the word builtin. Footer: every item is a dated entry in docs/COMPOUND.md.</desc>

  <rect width="900" height="500" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="11" letter-spacing="2.2" fill="#777777">WHERE THE DEFECTS SURFACED</text>
  <text x="450" y="72" text-anchor="middle" font-size="22" font-weight="600" fill="#000000">Each kind of check found a different kind of defect.</text>

  <!-- column 1: gates -->
  <rect rx="2" x="40" y="100" width="190" height="340" fill="#fafafa" stroke="#e5e5e5"/>
  <rect x="40" y="100" width="4" height="340" fill="#a7a9b7"/>
  <text x="58" y="128" font-size="11" letter-spacing="1.8" fill="#777777">A GATE THAT RUNS</text>
  <text x="58" y="147" font-size="12" font-style="italic" fill="#555555">make verify, CI</text>
  <line x1="58" y1="160" x2="216" y2="160" stroke="#e5e5e5"/>
  <g font-size="14" fill="#555555">
    <text x="58" y="186">Typed <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">q)</tspan> prompts in</text>
    <text x="58" y="204">lesson 02's outputs</text>
    <text x="58" y="240">Em dashes in figure</text>
    <text x="58" y="258">text, one in a tspan</text>
    <text x="58" y="294">A missing CI secret:</text>
    <text x="58" y="312">main went red</text>
  </g>

  <!-- column 2: review -->
  <rect rx="2" x="250" y="100" width="190" height="340" fill="#fafafa" stroke="#e5e5e5"/>
  <rect x="250" y="100" width="4" height="340" fill="#a7a9b7"/>
  <text x="268" y="128" font-size="11" letter-spacing="1.8" fill="#777777">AN INDEPENDENT REVIEW</text>
  <text x="268" y="147" font-size="12" font-style="italic" fill="#555555">Codex, reading the whole text</text>
  <line x1="268" y1="160" x2="426" y2="160" stroke="#e5e5e5"/>
  <g font-size="14" fill="#555555">
    <text x="268" y="186">A "no attribute" grid</text>
    <text x="268" y="204">cell that had one</text>
    <text x="268" y="240"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">first bid</tspan>, where <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">aj</tspan></text>
    <text x="268" y="258">takes the last</text>
    <text x="268" y="294">"Name an index" over a</text>
    <text x="268" y="312">loop that binds items</text>
    <text x="268" y="348">Connector tools in 3 of</text>
    <text x="268" y="366">15 plugin sessions</text>
  </g>

  <!-- column 3: publishing -->
  <rect rx="2" x="460" y="100" width="190" height="340" fill="#fafafa" stroke="#e5e5e5"/>
  <rect x="460" y="100" width="4" height="340" fill="#a7a9b7"/>
  <text x="478" y="128" font-size="11" letter-spacing="1.8" fill="#777777">PREPARING TO PUBLISH</text>
  <text x="478" y="147" font-size="12" font-style="italic" fill="#555555">redaction, rendering</text>
  <line x1="478" y1="160" x2="636" y2="160" stroke="#e5e5e5"/>
  <g font-size="14" fill="#555555">
    <text x="478" y="186">An auto-memory folder</text>
    <text x="478" y="204">nobody had checked</text>
    <text x="478" y="240">A corrected claim left</text>
    <text x="478" y="258">in a figure and its card</text>
  </g>

  <!-- column 4: elsewhere -->
  <rect rx="2" x="670" y="100" width="190" height="340" fill="#fafafa" stroke="#e5e5e5"/>
  <rect x="670" y="100" width="4" height="340" fill="#34374C"/>
  <text x="688" y="128" font-size="11" letter-spacing="1.8" fill="#777777">RUNNING IT ELSEWHERE</text>
  <text x="688" y="147" font-size="12" font-style="italic" fill="#555555">a clean checkout, a new plugin</text>
  <line x1="688" y1="160" x2="846" y2="160" stroke="#e5e5e5"/>
  <g font-size="14" fill="#555555">
    <text x="688" y="186">Built-in plugins in</text>
    <text x="688" y="204">every session</text>
    <text x="688" y="240">A seeded order with</text>
    <text x="688" y="258">B first in every pair</text>
    <text x="688" y="294">A scorer that broke</text>
    <text x="688" y="312">on relative paths</text>
    <text x="688" y="348">A redactor that</text>
    <text x="688" y="366">rewrote "builtin"</text>
  </g>

  <text x="450" y="472" text-anchor="middle" font-size="13" font-style="italic" fill="#777777">Every item is a dated entry in docs/COMPOUND.md.</text>
</svg>
